version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: unisense-postgres
    environment:
      POSTGRES_DB: unisense
      POSTGRES_USER: unisense_user
      POSTGRES_PASSWORD: unisense_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unisense_user -d unisense"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unisense-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unisense-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://unisense_user:unisense_password@postgres:5432/unisense
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8001
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      SMS_API_KEY: ${SMS_API_KEY}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run start:dev

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: unisense-ai-service
    environment:
      DATABASE_URL: postgresql://unisense_user:unisense_password@postgres:5432/unisense
      MODEL_PATH: /app/models
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: unisense-whatsapp-service
    environment:
      WHATSAPP_API_URL: ${WHATSAPP_API_URL}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://unisense_user:unisense_password@postgres:5432/unisense
    ports:
      - "8002:8002"
    volumes:
      - ./whatsapp-service:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unisense-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
