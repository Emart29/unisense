version: '3.8'

services:
  postgres:
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    restart: always

  backend:
    restart: always
    environment:
      NODE_ENV: production
    command: npm run start:prod
    volumes:
      - ./backend/dist:/app/dist

  ai-service:
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 4

  whatsapp-service:
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --workers 4

  frontend:
    restart: always
    command: npm run start
